name: Secure GitOps Cloud Enclave Deployment

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:

  security-audit:
    name: DevSecOps Compliance Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Trivy IaC Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          hide-progress: false
          format: 'table'
          exit-code: '0' 
          severity: 'HIGH,CRITICAL'

  provision-and-deploy:
    name: Cloud Provision & Deploy
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      
      - name: Authenticate to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform Engine
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

     
      # Initialize, import the stray resource group, and execute deployments
      - name: Terraform Orchestration
        env:
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          cd terraform
          terraform init -backend=false
          terraform workspace select -or-create dev
          
          terraform import azurerm_resource_group.rg /subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/secure-enclave-rg || echo "Resource already tracked or import skipped"
          terraform import azurerm_log_analytics_workspace.law /subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/secure-enclave-rg/providers/Microsoft.OperationalInsights/workspaces/platform-logs || echo "Log analytics workspace already there, skipping."
          terraform apply -auto-approve
          
          echo "ACR_NAME=$(terraform output -raw container_registry_name 2>/dev/null || az acr list --query '[0].name' -o tsv)" >> $GITHUB_ENV
          echo "ACR_SERVER=$(terraform output -raw container_registry_server 2>/dev/null || az acr list --query '[0].loginServer' -o tsv)" >> $GITHUB_ENV
          echo "ACA_NAME=$(terraform output -raw container_app_name 2>/dev/null || echo 'secure-service')" >> $GITHUB_ENV
          echo "RG_NAME=$(terraform output -raw resource_group_name 2>/dev/null || echo 'secure-enclave-rg')" >> $GITHUB_ENV

      
      - name: Build & Push Hardened Docker Image via ACR Task
        run: |
          az acr build --registry ${{ env.ACR_NAME }} --image secure-api:${{ github.sha }} ./app

      
      - name: Deploy Container Revision to Cloud Fabric
        run: |
          az containerapp update \
            --name ${{ env.ACA_NAME }} \
            --resource-group ${{ env.RG_NAME }} \
            --image ${{ env.ACR_SERVER }}/secure-api:${{ github.sha }}